name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conflict-marker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Search for unresolved conflict markers
        run: ./scripts/check-conflict-markers.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt pytest-cov==7.1.0
      - name: Lint backend
        run: ruff check backend tests
      - name: Validate AI reviewer syntax
        run: python -m py_compile .github/scripts/ai_review.py
      - name: Run backend tests with coverage
        run: python -m pytest --cov=backend --cov-report=term-missing --cov-report=xml --cov-fail-under=70 -q
      - name: Fresh database initialization and data sync
        run: |
          python -m backend.database.init_db --seed
          python -m backend.database.sync_data
        env:
          DATABASE_PATH: /tmp/ci-app.db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run type-check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install application dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          npm ci --prefix frontend
      - name: Install E2E dependencies
        run: npm install --prefix e2e --no-audit --no-fund
      - name: Install Chromium
        run: cd e2e && npx playwright install --with-deps chromium
      - name: Initialize E2E database and accounts
        env:
          DATABASE_PATH: /tmp/team-project-e2e.db
        run: |
          python -m backend.database.init_db --seed
          AUTH_BOOTSTRAP_PASSWORD=e2e-student-pass python -m backend.auth.bootstrap --username hossein --role student --user-id hossein
          AUTH_BOOTSTRAP_PASSWORD=e2e-professor-pass python -m backend.auth.bootstrap --username professor --role professor
      - name: Run browser flows
        run: npm test --prefix e2e
        env:
          DATABASE_PATH: /tmp/team-project-e2e.db
