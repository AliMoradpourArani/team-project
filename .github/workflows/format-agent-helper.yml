name: Format Agent Helper

on:
  push:
    branches:
      - feature/ai-workspace

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Print canonical agent formatting
        working-directory: frontend
        run: npx prettier src/components/AIAgentPanel.tsx
