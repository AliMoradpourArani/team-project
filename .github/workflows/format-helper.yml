name: Format helper

on:
  push:
    branches:
      - feature/ai-workspace

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Print canonical file
        working-directory: frontend
        run: |
          echo '---BEGIN-FORMATTED---'
          npx prettier src/components/AIWorkspace.tsx
          echo '---END-FORMATTED---'
