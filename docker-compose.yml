services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      DATABASE_PATH: /app/runtime/team-project.db
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-team_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-8}

      GITHUB_INTEGRATION_ENABLED: ${GITHUB_INTEGRATION_ENABLED:-true}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-HoosseinRahimi/team-project}
      GITHUB_CACHE_TTL_SECONDS: ${GITHUB_CACHE_TTL_SECONDS:-60}
      GITHUB_API_TIMEOUT_SECONDS: ${GITHUB_API_TIMEOUT_SECONDS:-5}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

      PROJECT_RUNNER_ENABLED: ${PROJECT_RUNNER_ENABLED:-false}
      PROJECT_RUNNER_TIMEOUT_SECONDS: ${PROJECT_RUNNER_TIMEOUT_SECONDS:-5}
      PROJECT_RUNNER_OUTPUT_LIMIT: ${PROJECT_RUNNER_OUTPUT_LIMIT:-16000}

      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-5-mini}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-20}
      AI_RAG_MAX_FILE_BYTES: ${AI_RAG_MAX_FILE_BYTES:-262144}
      AI_API_KEY: ${AI_API_KEY:-}

      AI_AUTOMATION_ENABLED: ${AI_AUTOMATION_ENABLED:-true}
      AI_AUTOMATION_INTERVAL_SECONDS: ${AI_AUTOMATION_INTERVAL_SECONDS:-3600}
      AI_AUTOMATION_APPLY_PROGRESS: ${AI_AUTOMATION_APPLY_PROGRESS:-false}

      AI_GITHUB_REPOSITORY: ${AI_GITHUB_REPOSITORY:-HoosseinRahimi/team-project}
      AI_GITHUB_TIMEOUT_SECONDS: ${AI_GITHUB_TIMEOUT_SECONDS:-15}
      AI_GITHUB_TOKEN: ${AI_GITHUB_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./projects:/app/projects:ro
      - team-runtime:/app/runtime
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"

volumes:
  team-runtime:
